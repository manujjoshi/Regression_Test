name: Uptime check

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the live site
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL variable is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          # Free Render services sleep when idle, so allow time to wake up
          curl --fail -sS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "$APP_URL/health"
          curl --fail -sS --max-time 90 "$APP_URL/" | grep -q "Learning CI/CD"
          echo "Site is up"
