services:
  - type: web
    name: student-score-predictor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train_model.py
    startCommand: gunicorn app:app
    autoDeploy: false # deploys are triggered by the GitHub Action after tests pass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
